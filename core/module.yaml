product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $libs.koin.core : exported
  - $libs.runtime
  - $libs.foundation
  - $libs.material3
  - $libs.ui
  - $libs.components.resources
  - $libs.ui.tooling.preview
  - $libs.androidx.lifecycle.viewmodelCompose
  - $libs.androidx.lifecycle.runtimeCompose
  - $libs.material.icons.extended
  - $libs.kotlinx.serialization.json
  - $libs.koin.compose.viewmodel
  - $libs.kotlinx.immutable.collections
  - $libs.ktor.client.core
  - $libs.ktor.client.auth
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.ktor.client.logging
  - $libs.coil.compose
  - $libs.coil.network.ktor
  - $libs.androidx.datastore.preferences.core
  - $libs.androidx.datastore.core.okio

dependencies@android:
  - $libs.koin.android
  - $libs.ktor.client.okhttp
  - $libs.chucker.release
  - $libs.androidx.datastore.preferences

dependencies@jvm:
  - $compose.desktop.currentOs
  - $libs.kotlinx.coroutinesSwing
  - $libs.ktor.client.cio

dependencies@ios:
  - $libs.ktor.client.darwin

settings:
  compose:
    enabled: true
    resources:
      packageName: com.ranjan.somiq.core.resources
      exposedAccessors: true
  kotlin:
    serialization: enabled