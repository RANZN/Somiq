product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - //core
  - //feature/auth
  - //feature/feed
  - //feature/profile
  - //feature/chat
  - //feature/media
  - //feature/media-editor
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.material.icons.extended
  - $libs.jetbrains.navigation3.ui
  - $libs.kotlinx.serialization.json
  - $libs.koin.compose.viewmodel
  - $libs.koin.core
  - $libs.room.runtime
  - $libs.sqlite.bundled
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.kotlinx.serialization.core
  - io.coil-kt.coil3:coil-compose-core:3.5.0
  - $libs.kotlinx.immutable.collections

dependencies@android:
  - $compose.uiTooling
  - $libs.koin.android
  - $libs.ktor.client.okhttp

dependencies@jvm:
  - $compose.desktop.currentOs
  - $libs.kotlinx.coroutinesSwing
  - $libs.ktor.client.cio

dependencies@ios:
  - $libs.ktor.client.darwin

settings:
  compose:
    enabled: true
    resources:
      packageName: com.ranjan.somiq.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    freeCompilerArgs:
      - Xexpect-actual-classes
    serialization: enabled
    ksp:
      processors:
        - $libs.room.compiler
      processorOptions:
        room.schemaLocation: ./schemas